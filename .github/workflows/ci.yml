# CI: prove every push to main and every PR — JVM tests, Android lint, debug
# and release APKs, the PDFium render proof, and a debug APK uploaded as a
# rolling artifact.
#
# Hardening (family contract):
#   - least-privilege token (contents: read)
#   - cancel superseded PR runs, but never an in-progress main run — a
#     permanently "cancelled" main commit masks breakage and breaks bisection
#   - timeout on every job so a wedged Gradle daemon can't burn runner hours

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Test, lint, assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Supply-chain gate: reject a tampered gradle-wrapper.jar.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # No SDK install step: the ubuntu runner image ships the Android SDK,
      # and AGP resolves compileSdk android-37.0 against it (paired with
      # android.suppressUnsupportedCompileSdk in gradle.properties).
      - uses: gradle/actions/setup-gradle@v6

      - name: Test, lint, and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      # The release variant is the only one that runs R8, and R8 failures are
      # invisible until they aren't: prove the APK that gets released still
      # builds and shrinks on every PR, not once a tag is already pushed.
      - name: Assemble release (proves R8 / minification)
        run: ./gradlew assembleRelease

      # Second verifier, deliberately not Gradle: the tests above write export
      # fixtures to app/build/test-output/raster-proof/, and this re-renders
      # them with PDFium — independent of PDFBox — checking ink placement and
      # text/artwork preservation at all four rotations.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PDF check dependencies
        run: pip install -r scripts/pdf-test-requirements.txt

      - name: Re-render test exports with PDFium
        run: python3 scripts/verify_pdf.py

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: asterinked-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
